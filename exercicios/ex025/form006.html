<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário 006</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
        <fieldset>
            <legend>Escolha Cor e envie a foto</legend>
            <p>
                <label for="icor">Cor: </label>
                <input type="color" name="cor" id="cor" value="#000000" required>
            </p>

            <p>
                <label for="inivel">Nível de Satisfação</label>
                <input type="range" name="range" id="inivel" min="1" max="10" step="1" value="5" required>
            </p>

            <p>
                <label for="ifoto">Foto do Perfil: </label>
                <input type="file" name="foto" id="ifoto" accept="image/*" required>
            </p>
            
            <p>
                <input type="submit" value="enviar">
                <input type="reset" value="limpar">
            </p>
        </fieldset>
    </form>
</body>
</html>
