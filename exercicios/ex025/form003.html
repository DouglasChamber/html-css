<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Teste de Formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <p>
            <label form="inome">Nome</label>
            <input type="text" name="nome" id="inome"required minlength="5" maxlength="25" placeholder="Nome Completo" autocomplete="name">
        </p>
        <p>
            <label for="imedia">Média</label>
            <input type="number" name="media" id="imedia" required min="0" max="10" step="0.1" placeholder="0 a 10" required>
        </p>
        <p>
            <label for="imes">Peíodo Letivo</label>
            <input type="month" name="mes" id="imes" required value="2025-10">
        </p>
        <p>
            <label for="idata">Data da Prova</label>
            <input type="date" name="data" id="idata" required value="2000-01-01" min="1900-01-01" max="2024-12-31">
        </p>
        <p>
            <label for="ihora">Dia da Prova</label>
            <input type="time" name="hora" id="ihora" required value="12:00" min="08:00" max="18:00">
        </p>
        <p>
            <input type="submit" value="enviar">
            <input type="reset" value="limpar">
        </p>
    </form>
</body>
</html>
